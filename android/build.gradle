buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        // NDK r28+: ELF segments are 16KB-aligned by default (Google Play
        // 16KB page size requirement). Do not downgrade below r28.
        ndkVersion = "28.2.13676358"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
        // Huawei AGConnect artifacts (used once the hms flavor goes live).
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Firebase (gms flavor): google-services.json processing + Crashlytics
        classpath("com.google.gms:google-services:4.4.3")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.5")
        // Huawei AGConnect — uncomment when activating the hms flavor
        // (see README → Huawei (HMS) setup):
        // classpath("com.huawei.agconnect:agcp:1.9.1.304")
    }
}

apply plugin: "com.facebook.react.rootproject"
