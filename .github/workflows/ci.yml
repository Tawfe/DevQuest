name: CI

on:
  push:
    branches: [Development, main]
  pull_request:

jobs:
  quality:
    name: Type-check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:ci

  android-16kb-alignment:
    name: Android build + 16KB alignment check
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # CI builds against the placeholder Firebase config — the APK is only
      # inspected for native-library alignment, never run.
      - name: Use placeholder google-services.json
        run: cp android/app/src/gms/google-services.example.json android/app/src/gms/google-services.json

      - name: Build gms release APK
        run: ENVFILE=.env.production ./gradlew :app:assembleGmsRelease --no-daemon
        working-directory: android

      - name: Check 16KB ELF alignment
        run: bash scripts/check_elf_alignment.sh android/app/build/outputs/apk/gms/release/app-gms-release.apk
